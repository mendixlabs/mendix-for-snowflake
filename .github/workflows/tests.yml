# Unit/integration tests for the two Python services. Fully offline: every
# Snowflake and HTTP boundary is mocked; no credentials are used anywhere.

name: tests

on:
  push:
    branches: [main]
    paths:
      - 'Controller/**'
      - 'Admin UI/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Controller/**'
      - 'Admin UI/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.service }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [Controller, Admin UI]
        python-version: ['3.12', '3.14']
        include:
          - service: Controller
            slug: controller
            requirements: Controller/requirements.txt
            tests: Controller/tests
            cov: Controller/app
            # Currently ~95%; the floor is a regression backstop (e.g. a file's tests
            # silently dropping to 0%), not a target - keep well above it, not at it.
            cov_fail_under: '90'
          - service: Admin UI
            slug: admin-ui
            requirements: Admin UI/requirements.txt
            tests: Admin UI/tests
            cov: Admin UI/app
            # Currently ~82% (pages/* is coverage-omitted by design; see pyproject.toml).
            cov_fail_under: '75'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Cover both runtimes while the service images move to Python 3.14.
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.requirements }}" -r requirements-dev.txt
      - name: Run pytest with coverage
        run: >
          python -m pytest "${{ matrix.tests }}"
          "--cov=${{ matrix.cov }}"
          --cov-report=term-missing
          "--cov-report=xml:coverage-${{ matrix.slug }}.xml"
          "--cov-fail-under=${{ matrix.cov_fail_under }}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.slug }}-${{ matrix.python-version }}
          path: coverage-${{ matrix.slug }}.xml
